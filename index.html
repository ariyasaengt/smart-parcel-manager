<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบพัสดุหอพัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body { font-family: 'Prompt', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="authScreen" class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-6">
        <div class="text-center mb-5">
          <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-xl bg-indigo-100 text-2xl text-indigo-600">
            <i class="fa-solid fa-boxes-packing"></i>
          </div>
          <h1 class="text-xl font-bold">ระบบจัดการพัสดุหอพัก</h1>
          <p class="mt-1 text-xs text-slate-500">เชื่อมต่อฐานข้อมูล Cloud Sheets</p>
        </div>

        <div class="mb-4 flex border-b border-slate-200 text-xs font-semibold">
          <button id="tabLoginBtn" class="flex-1 border-b-2 border-indigo-600 py-2 text-indigo-600">เข้าสู่ระบบ</button>
          <button id="tabRegisterBtn" class="flex-1 py-2 text-slate-400">ลงทะเบียน</button>
        </div>

        <form id="loginForm" class="space-y-3">
          <div>
            <label class="mb-1 block text-xs font-semibold">ชื่อผู้ใช้</label>
            <input id="loginUsername" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold">รหัสผ่าน</label>
            <input id="loginPassword" type="password" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
          </div>
          <button id="loginSubmitBtn" type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-bold text-white shadow">
            เข้าสู่ระบบ
          </button>
        </form>

        <form id="registerForm" class="hidden space-y-3">
          <div>
            <label class="mb-1 block text-xs font-semibold">ชื่อหอพัก</label>
            <input id="regDormName" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold">ชื่อผู้ใช้</label>
            <input id="regUsername" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold">รหัสผ่าน</label>
            <input id="regPassword" type="password" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
          </div>
          <button id="registerSubmitBtn" type="submit" class="w-full rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-bold text-white shadow">
            สร้างหอพัก
          </button>
        </form>
      </div>
    </div>

    <div id="appScreen" class="hidden">
      <header class="bg-indigo-700 text-white shadow">
        <div class="mx-auto max-w-5xl px-4 py-3">
          <div class="flex items-center justify-between">
            <div>
              <h2 id="appDormName" class="text-base font-bold">หอพัก</h2>
              <p class="text-[11px] text-indigo-200">ผู้ใช้: <span id="appUsername"></span></p>
            </div>
            <button id="logoutBtn" class="rounded-lg bg-white/10 px-3 py-1.5 text-xs font-semibold">ออกจากระบบ</button>
          </div>
        </div>
      </header>

      <main class="mx-auto max-w-5xl space-y-4 px-4 py-4">
        <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="grid gap-2 sm:grid-cols-2">
            <button id="cameraBtn" class="rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white">
              <i class="fa-solid fa-camera mr-2"></i> เปิดกล้องถ่ายต่อเนื่อง
            </button>
            <button id="uploadBtn" class="rounded-xl bg-slate-100 px-4 py-3 text-sm font-bold text-slate-700 border border-slate-200">
              <i class="fa-regular fa-images mr-2"></i> เลือกรูปจากอัลบั้ม
            </button>
          </div>
          <input id="uploadInput" type="file" accept="image/*" multiple class="hidden" />

          <div id="previewPanel" class="mt-4 hidden">
            <div class="mb-2 flex items-center justify-between">
              <span class="text-xs font-semibold text-slate-600">ภาพที่เลือก</span>
              <button id="clearCapturedBtn" class="text-xs text-rose-500">ล้างทั้งหมด</button>
            </div>
            <div id="thumbnails" class="grid grid-cols-4 gap-2"></div>
            <button id="scanBtn" class="mt-3 w-full rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-bold text-white">
              <i class="fa-solid fa-wand-sparkles mr-2"></i> ประมวลผลรูปภาพด้วย AI
            </button>
          </div>
        </section>

        <section id="inspectionPanel" class="hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="mb-3 flex items-center justify-between">
            <h3 class="text-sm font-bold">ตรวจสอบข้อมูลที่อ่านได้</h3>
            <button id="addManualRowBtn" class="rounded-lg bg-indigo-50 px-2 py-1 text-[11px] font-semibold text-indigo-600">
              + เพิ่มเอง
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50">
                <tr>
                  <th class="px-2 py-2">ห้อง / ผู้รับ</th>
                  <th class="px-2 py-2">ขนส่ง</th>
                  <th class="px-2 py-2">COD</th>
                  <th class="px-2 py-2 text-right">ลบ</th>
                </tr>
              </thead>
              <tbody id="inspectionTableBody"></tbody>
            </table>
          </div>

          <div class="mt-4 flex gap-2">
            <button id="saveToSheetBtn" class="flex-1 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-bold text-white">
              บันทึกพัสดุลงชีต
            </button>
            <button id="generateMessageBtn" class="flex-1 rounded-xl bg-emerald-600 px-4 py-2 text-sm font-bold text-white">
              สร้างข้อความ LINE
            </button>
          </div>
        </section>

        <section id="lineMessagePanel" class="hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="mb-2 flex items-center justify-between">
            <h3 class="text-sm font-bold">ข้อความพร้อมส่ง LINE</h3>
            <span id="lineCountBadge" class="rounded-full bg-emerald-100 px-2 py-0.5 text-[10px] font-bold text-emerald-700">0 ชิ้น</span>
          </div>
          <textarea id="lineMessage" rows="10" class="w-full rounded-xl border border-slate-300 bg-slate-50 p-3 text-xs"></textarea>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button id="copyLineBtn" class="rounded-xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700">คัดลอกข้อความ</button>
            <button id="shareLineBtn" class="rounded-xl bg-[#06C755] px-4 py-2 text-sm font-bold text-white">ส่ง LINE</button>
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <h3 class="mb-3 text-sm font-bold">คลังพัสดุค้างรับ</h3>
          <div class="mb-3">
            <input id="inventorySearch" type="text" placeholder="ค้นหาห้อง / ผู้รับ..." class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50">
                <tr>
                  <th class="px-2 py-2">ห้อง / ผู้รับ</th>
                  <th class="px-2 py-2">วันที่</th>
                  <th class="px-2 py-2">สถานะ</th>
                  <th class="px-2 py-2">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="cameraModal" class="fixed inset-0 z-50 hidden bg-black/90">
      <div class="flex h-full flex-col">
        <div class="flex items-center justify-between p-3 text-white">
          <span class="text-xs font-bold text-rose-400">โหมดถ่ายต่อเนื่อง</span>
          <button id="closeCameraBtn" class="text-2xl">&times;</button>
        </div>
        <div class="relative flex-1 overflow-hidden">
          <video id="cameraVideo" class="h-full w-full object-cover" autoplay playsinline></video>
          <canvas id="captureCanvas" class="hidden"></canvas>
          <div class="absolute inset-6 flex items-center justify-center rounded-2xl border-2 border-white/40">
            <span class="rounded-full bg-black/40 px-3 py-1 text-[10px] text-white/80">กดปุ่มสีแดงเพื่อถ่ายทีละชิ้น</span>
          </div>
        </div>
        <div class="flex items-center justify-around bg-black/30 p-5">
          <div id="cameraCount" class="flex h-12 w-12 items-center justify-center rounded-xl border border-white/40 bg-slate-800 text-[10px] text-white/70">0 รูป</div>
          <button id="takeSnapshotBtn" class="flex h-16 w-16 items-center justify-center rounded-full border-4 border-white bg-rose-500">
            <span class="h-8 w-8 rounded-full bg-white"></span>
          </button>
          <button id="finishCameraBtn" class="rounded-xl bg-emerald-600 px-3 py-2 text-xs font-bold text-white">เสร็จสิ้น</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
